name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Release APK
        run: |
          set -o pipefail
          keytool -genkey -v -keystore keystore.jks \
            -alias lgzczs \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass lgzczs123 \
            -keypass lgzczs123 \
            -dname "CN=lgzczs, OU=lgzczs, O=lgzczs, L=Unknown, ST=Unknown, C=CN"
          echo "Keystore generated: $(ls -la keystore.jks)"
          ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/build.log
        shell: bash

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lgzczs-app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lgzczs-app-build-log
          path: /tmp/build.log
          retention-days: 1

      - name: Show errors
        if: failure()
        run: |
          grep -n -E "^e:|^Error|FAILED|error:|ERROR" /tmp/build.log 2>/dev/null | tail -40 | while IFS= read -r line; do
            printf '::error file=build.log::%s\n' "$line"
          done
          echo "--- Last 20 lines ---"
          tail -20 /tmp/build.log 2>/dev/null | while IFS= read -r line; do
            printf '::error file=build.log::%s\n' "$line"
          done
        shell: bash
