name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Check Gradle projects
        run: |
          set -o pipefail
          ./gradlew projects --stacktrace 2>&1 | tee /tmp/gradle_config.log
        shell: bash

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --info 2>&1 | tee /tmp/build.log
        shell: bash

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lgzczs-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build logs as artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lgzczs-app-build-logs
          path: /tmp/*.log
          retention-days: 1

      - name: Upload build logs to paste sites
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          echo "::group::Paste to ix.io (config log)"
          CFG_URL=$(cat /tmp/gradle_config.log 2>/dev/null | curl -sS -F 'f:1=<-' https://ix.io) && echo "::notice title=ConfigLogPaste::$CFG_URL" || echo "Config log paste failed"
          echo "::endgroup::"
          echo "::group::Paste to ix.io (build log)"
          BUILD_URL=$(curl -sS -F 'f:1=@/tmp/build.log' https://ix.io) && echo "::notice title=BuildLogPaste::$BUILD_URL" || echo "Build log paste failed"
          echo "::endgroup::"
          echo "::group::Paste last 200 lines of build log to ix.io"
          tail -200 /tmp/build.log 2>/dev/null | curl -sS -F 'f:1=<-' https://ix.io | while IFS= read -r url; do echo "::notice title=BuildLogTail::$url"; done
          echo "::endgroup::"

      - name: Dump logs as annotations (Python)
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          python3 << 'PYEOF'
import os

for path in ['/tmp/gradle_config.log', '/tmp/build.log']:
    try:
        with open(path) as f:
            lines = f.readlines()
    except FileNotFoundError:
        continue
    basename = os.path.basename(path)
    for i, line in enumerate(lines[-80:], 1):
        line = line.rstrip('\n').rstrip('\r')
        if not line:
            continue
        escaped = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
        print(f'::warning title={basename}-L{i}::{escaped}')
PYEOF

      - name: Step summary
        if: failure()
        continue-on-error: true
        run: |
          {
            echo "# Build Log"
            echo '```'
            cat /tmp/build.log 2>/dev/null | tail -60
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
