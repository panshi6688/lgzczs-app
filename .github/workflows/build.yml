name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Check Gradle projects
        run: |
          set -o pipefail
          ./gradlew projects --stacktrace 2>&1 | tee /tmp/gradle_config.log
        shell: bash

      - name: Build Debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --info 2>&1 | tee /tmp/build.log
        shell: bash

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lgzczs-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log (always)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lgzczs-app-build-log
          path: /tmp/build.log
          retention-days: 1

      - name: Upload build logs to paste sites
        if: failure()
        continue-on-error: true
        run: |
          echo "::group::ix.io paste (full config log)"
          URL=$(cat /tmp/gradle_config.log 2>/dev/null | curl -s -F 'f:1=<-' https://ix.io) && echo "Config log: $URL" || echo "Config log paste failed"
          echo "::endgroup::"
          echo "::group::ix.io paste (build log)"
          URL=$(curl -s -F 'f:1=@/tmp/build.log' https://ix.io) && echo "Build log: $URL" || echo "Build log paste failed"
          echo "::endgroup::"
          echo "::group::Step summary"
          { echo "# Build Log Summary"; echo '```'; cat /tmp/build.log 2>/dev/null | tail -60; echo '```'; } >> $GITHUB_STEP_SUMMARY
          echo "::endgroup::"
