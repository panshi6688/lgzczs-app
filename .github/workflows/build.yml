name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Generate Screenshot
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq libegl1 libgles2 libgl1-mesa-dri mesa-utils 2>&1 || true
          MESA_GL_VERSION_OVERRIDE=3.3 ./gradlew testDebugUnitTest --tests "com.lgzczs.app.ui.DataPageScreenshotTest" --stacktrace 2>&1
        shell: bash

      - name: Upload Test Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          retention-days: 3

      - name: Upload Screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-datapage
          path: screenshots/DataPage.png
          retention-days: 7

      - name: Build Release APK
        run: |
          set -o pipefail
          echo "JAVA_HOME=$JAVA_HOME"
          keytool -genkey -v -keystore "$GITHUB_WORKSPACE/keystore.jks" \
            -alias lgzczs \
            -keyalg RSA -keysize 2048 \
            -validity 10000 \
            -storepass lgzczs123 \
            -keypass lgzczs123 \
            -dname "CN=lgzczs, OU=lgzczs, O=lgzczs, L=Unknown, ST=Unknown, C=CN" 2>&1
          ls -la "$GITHUB_WORKSPACE/keystore.jks"
          ./gradlew assembleRelease --stacktrace 2>&1 | tee /tmp/build.log
        shell: bash

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lgzczs-app-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lgzczs-app-build-log
          path: /tmp/build.log
          retention-days: 1

      - name: Show errors
        if: failure()
        run: |
          grep -n -E "^e:|^Error|FAILED|error:|ERROR" /tmp/build.log 2>/dev/null | tail -40 | while IFS= read -r line; do
            printf '::error file=build.log::%s\n' "$line"
          done
          echo "--- Last 20 lines ---"
          tail -20 /tmp/build.log 2>/dev/null | while IFS= read -r line; do
            printf '::error file=build.log::%s\n' "$line"
          done
        shell: bash
