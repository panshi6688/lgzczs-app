name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace 2>&1 | tee /tmp/build.log; exit ${PIPESTATUS[0]}
        shell: bash

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lgzczs-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload build log (always)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lgzczs-app-build-log
          path: /tmp/build.log
          retention-days: 1

      - name: Show errors
        if: failure()
        run: |
          echo "::group::Compilation errors"
          grep -n -i "error:" /tmp/build.log | head -80 | while IFS= read -r line; do echo "::error::$line"; done
          echo "::endgroup::"
          echo "::group::Last 50 lines"
          tail -50 /tmp/build.log
          echo "::endgroup::"
